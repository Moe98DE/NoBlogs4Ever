# Dependabot proposes updates; a maintainer reviews release notes and runs the full CI before merging.
# WordPress core, plugins, themes and languages are locked in dependencies.lock.json — update them with scripts/lock.py.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
  - package-ecosystem: composer
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
ignore:
      - dependency-name: mariadb
        update-types: [version-update:semver-major, version-update:semver-minor]    
