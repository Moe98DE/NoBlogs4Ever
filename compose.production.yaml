# Requires Docker Compose 2.24.4+ for !override.
services:
  edge:
    ports: !override ['80:80', '443:443']
    volumes: !override ['./config/Caddyfile.production:/etc/caddy/Caddyfile:ro', '${TLS_DIRECTORY:?Set TLS_DIRECTORY}:/run/tls:ro', 'caddy:/data']
    read_only: true
    tmpfs: [/config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
  mail:
    profiles: [development]
  app:
    build: !reset null
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETUID, NET_BIND_SERVICE]
  worker:
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
  backup:
    read_only: true
    tmpfs: [/tmp, /scratch]
    cap_drop: [ALL]
