<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|sh|shtml)(\.|$)">
        Require all denied
    </FilesMatch>
    php_admin_flag engine off
</Directory>
# Request logging deliberately disabled. Application emits allowlisted events.
CustomLog /dev/null common
ErrorLog /dev/null
